<!-- begin subscribe -->
{% assign c = "c-subscribe" %}
<section class="{{c}} section">
  <div class="container">
    <div class="row">
      <div class="col col-12">

        <div class="{{c}}__inner">
          <div class="{{c}}__info">
            <h3 class="{{c}}__title">{{ include.newsletter_title }}</h3>
            <div class="{{c}}__subtitle">
              <span id="ityped"></span>
            </div>
          </div>

          <form class="{{c}}__form validate"
            data-managed-form="newsletter"
            data-endpoint="{{ site.data.forms.newsletter.endpoint | escape }}"
            data-fallback-email="{{ site.data.forms.newsletter.fallback_email | escape }}"
            data-fallback-subject="{{ site.data.forms.newsletter.fallback_subject | escape }}"
            method="POST"
            id="membedded-subscribe-form"
            name="membedded-subscribe-form"
            novalidate>
            <label class="screen-reader-text" for="mce-EMAIL">Email address</label>
            <input class="{{c}}__form-email required email" id="mce-EMAIL" type="email" name="EMAIL" placeholder="Your email address" required>
            <button class="c-button c-button--primary c-button--large" id="membedded-subscribe" type="submit" name="subscribe">{{ include.newsletter_button }}</button>
            <p class="{{c}}__form-status" data-form-status aria-live="polite"></p>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>
<!-- end subscribe -->

<script>
  var itype_text = ['{{ include.newsletter_description }}'];
</script>
